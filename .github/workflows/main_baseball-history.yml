# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - baseball-history

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build baseball-history-web/baseball-history-web.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish baseball-history-web/baseball-history-web.csproj -c Release -o ./publish
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: .net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the OIDC token

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'baseball-history'
          slot-name: 'Production'
          package: .

          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_E21EDEC1FA3B4E079F18B39DBEFCF737 }}

      # The publish profile can't restart the app, so the restart signs in
      # with OIDC through the baseball-history-web-deploy managed identity
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.WEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WEB_AZURE_SUBSCRIPTION_ID }}

      # The zip deploy overwrites DLLs the running process has mapped, which
      # surfaces as BadImageFormatException until the app restarts
      - name: Restart Azure Web App
        run: az webapp restart --name baseball-history --resource-group baseball-history-rg


