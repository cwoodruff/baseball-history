# Deploys the MCP server to Azure Web App baseball-history-mcp.
# Basic auth publishing is disabled on that app, so this signs in with OIDC
# through the baseball-history-mcp-deploy managed identity (federated to main).

name: Build and deploy MCP server to Azure Web App - baseball-history-mcp

on:
  push:
    branches:
      - main
    paths:
      - 'baseball-history-mcp/**'
      - 'baseball-history-data/**'
      - 'baseball-history-servicedefaults/**'
      - '.github/workflows/main_baseball-history-mcp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build with dotnet
        run: dotnet build baseball-history-mcp/baseball-history-mcp.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish baseball-history-mcp/baseball-history-mcp.csproj -c Release -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: mcp-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the OIDC token

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: mcp-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.MCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MCP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MCP_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'baseball-history-mcp'
          slot-name: 'Production'
          package: .
